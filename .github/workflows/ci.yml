name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SKIP_ENV_VALIDATION: '1'

jobs:
  lint-typecheck-build-test:
    name: Lint · Typecheck · Build · Unit Tests
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: re_ci_dummy_key
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run --reporter=github-actions

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: lint-typecheck-build-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      RESEND_API_KEY: re_e2e_dummy_key
      NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-dummy-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Real Prisma migrations against a throwaway Postgres — not a hand-rolled fake
      # DB — so query behavior can never diverge from production. Only Supabase Auth
      # is stubbed (E2E_MOCK=1, see lib/supabase/e2e-mock.ts) since GoTrue itself
      # isn't running in CI.
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Seed E2E fixture tenant
        run: npx tsx e2e/seed.ts

      - run: npm run build
        env:
          E2E_MOCK: '1'

      - name: Run Playwright
        run: npx playwright test
        env:
          E2E_MOCK: '1'

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
